# Upptime does not read certificate expiry, so this job does: one issue per watched install
# whose certificate expires within 14 days or cannot be read. Hostnames come from the
# CERT_HOSTS secret, a JSON map of label to host, and never reach the log or an issue.
name: Certificate expiry
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  check:
    name: Check certificate expiry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Check certificates and open issues
        run: node scripts/cert-days.mjs
        env:
          CERT_HOSTS: ${{ secrets.CERT_HOSTS }}
          GITHUB_TOKEN: ${{ github.token }}
