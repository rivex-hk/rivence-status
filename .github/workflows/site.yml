# Publishes site/ to gh-pages. data/ belongs to the probe and CNAME to the Pages setup, so both
# are left as they are; everything else on gh-pages is replaced by site/.
name: Site
on:
  push:
    branches: [main]
    paths:
      - "site/**"
  workflow_dispatch:
permissions: {}
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  publish:
    name: Publish the page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: code
          persist-credentials: false
      - name: Checkout gh-pages
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: gh-pages
          path: pages
      - name: Replace the page, keeping data/ and CNAME
        run: |
          find pages -mindepth 1 -maxdepth 1 ! -name .git ! -name data ! -name CNAME -exec rm -rf {} +
          cp -r code/site/. pages/
      - name: Commit the page if it changed
        run: bash code/scripts/push-pages.sh pages "Publish the status page" .
