# From the Upptime v1.46.0 template (github.com/upptime/upptime, MIT), owned here by hand so
# every action stays pinned by commit SHA. Upgrading Upptime re-pins every workflow at once.
# Runs when a person pushes a .upptimerc.yml change, so an added install shows on the page
# without waiting a day. It does every step in this one job, because pushes made with
# GITHUB_TOKEN never start another workflow. SECRETS_CONTEXT allowlists the site URL secrets;
# the graphs and site steps run unpinned npm packages and never see them.
name: Setup CI
on:
  push:
    paths:
      - ".upptimerc.yml"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Setup Upptime
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Mask watched hostnames
        run: node scripts/mask-hosts.mjs
        env:
          SECRETS_CONTEXT: '{"EU_1_URL":${{ toJson(secrets.EU_1_URL) }}}'
      - name: Update response time
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{"EU_1_URL":${{ toJson(secrets.EU_1_URL) }}}'
      - name: Update summary in README
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: "readme"
        env:
          GH_PAT: ${{ github.token }}
      - name: Setup Node.js for graphs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
      - name: Generate graphs
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: "graphs"
        env:
          GH_PAT: ${{ github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: "site"
        env:
          GH_PAT: ${{ github.token }}
      - name: GitHub Pages Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
