# From the Upptime v1.46.0 template (github.com/upptime/upptime, MIT), owned here by hand so
# every action stays pinned by commit SHA. Upgrading Upptime re-pins every workflow at once.
# Upptime runs on the workflow's own GITHUB_TOKEN, so incident issues are authored by
# github-actions[bot] and notify the owner. SECRETS_CONTEXT allowlists the site URL secrets.
name: Response Time CI
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Mask watched hostnames
        run: node scripts/mask-hosts.mjs
        env:
          SECRETS_CONTEXT: '{"EU_1_URL":${{ toJson(secrets.EU_1_URL) }}}'
      - name: Update response time
        uses: upptime/uptime-monitor@a284d6064bcbf89db3f1e2a6c533d0e69111573b # v1.46.0
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: '{"EU_1_URL":${{ toJson(secrets.EU_1_URL) }}}'
