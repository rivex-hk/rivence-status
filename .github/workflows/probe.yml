# Every five minutes: probe each install in the INSTALLS secret, open or close its incident
# issue, and commit the status data to gh-pages under data/. data/heartbeat.json changes on every run, so the
# page can tell a live probe from a stalled one.
name: Probe
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: probe
  cancel-in-progress: false
jobs:
  probe:
    name: Probe installs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: code
          persist-credentials: false
      - name: Checkout data
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: gh-pages
          path: pages
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
      - name: Probe and update the data
        run: node code/scripts/probe.mjs pages/data
        env:
          INSTALLS: ${{ secrets.INSTALLS }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit the data if it changed
        run: bash code/scripts/push-pages.sh pages "Update status data" data
